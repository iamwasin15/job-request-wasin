<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Request</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#10213f;--mute:#63728a;--line:#dde4ee;--accent:#2347e6;--navy:#0d1b3e;--open:#7b61d9;--prog:#2347e6;--pend:#e8731a;--done:#1f9d6b;--ot:#8793a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--card:#141e35;--ink:#e8edf7;--mute:#92a0b8;--line:#25324f;--accent:#7b93ff;--navy:#0a1226}}
:root[data-theme="dark"]{--bg:#0a1120;--card:#141e35;--ink:#e8edf7;--mute:#92a0b8;--line:#25324f;--accent:#7b93ff;--navy:#0a1226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans Thai",system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.hero{background:var(--navy);color:#fff;padding:30px 0 28px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.sub{color:#aebbd6;margin:4px 0 0}
.ports{display:flex;flex-wrap:wrap;gap:5px;min-height:18px}
.port{width:15px;height:15px;border-radius:4px;border:0;padding:0;cursor:pointer}
.port.dim{opacity:.2}
.ports .none{color:#aebbd6;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero :focus-visible{outline-color:#fff}
main.wrap{padding-top:22px;padding-bottom:80px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,33,63,.06)}
.kpi{border-top:4px solid var(--c);padding:14px 16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column}
.kpi[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:-2px}
.kn{font-size:34px;font-weight:700;line-height:1.1}.kl{font-weight:500}.ks{color:var(--mute);font-size:13px}
.charts{display:grid;grid-template-columns:1fr 1.3fr 1.4fr;gap:12px;margin-bottom:22px}
.card{padding:16px 18px}.card h3{margin:0 0 12px;font-size:16px;font-weight:600}
.donutbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.dh{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center;line-height:1.2}
.dh b{font-size:24px}.dh span{font-size:12px;color:var(--mute)}
.legend{font-size:13px;color:var(--mute);display:grid;gap:3px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.hb{display:grid;gap:2px}
.hrow{display:grid;grid-template-columns:104px 1fr 28px;gap:10px;align-items:center;width:100%;background:none;border:0;padding:5px 6px;border-radius:8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.hrow[aria-pressed="true"],.vcol[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.track i{display:block;height:100%;border-radius:5px}
.hrow b{text-align:right}
.vb{display:flex;align-items:flex-end;gap:6px;height:150px}
.vcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;background:none;border:0;border-radius:8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;padding:2px}
.vcol i{display:block;width:100%;max-width:32px;background:var(--accent);border-radius:6px 6px 0 0;min-height:4px}.vcol small{color:var(--mute);font-size:12px}
.mute{color:var(--mute);font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input{flex:2 1 220px;width:auto}.bar select{flex:1 1 130px;width:auto}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.hero{background:#fff;border-color:#fff;color:#0d1b3e;font-weight:600}
.btn.del{color:#d33a30}
.list{display:grid;gap:9px}
.row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bc,var(--ot));border-radius:14px;padding:13px 16px;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(16,33,63,.05)}
.row:hover{border-color:var(--accent);border-left-color:var(--bc,var(--ot))}
.l1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.l1 b{font-size:14px}
.lvl{font-style:normal;font-size:12px;font-weight:600;color:#fff;padding:1px 9px;border-radius:999px}
.br{font-size:13px;font-weight:600;color:var(--bc)}
.ds{display:block;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev{display:block;color:var(--mute);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:62ch}
.side{text-align:right;display:grid;gap:5px;justify-items:end}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 11px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.who{font-size:13px;color:var(--mute);max-width:230px}
.empty{padding:44px 20px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.foot{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
#veil{position:fixed;inset:0;background:rgba(10,16,30,.5);display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body.open #drawer{transform:none}body.open #veil{display:block}
#drawer h2{margin:0;font-size:20px;padding:18px 20px 8px}
#form{overflow:auto;padding:8px 20px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#form label{font-size:13px;color:var(--mute);display:block}
#form .full{grid-column:1/-1}
#form textarea{min-height:76px;resize:vertical}
.acts{display:flex;gap:8px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.acts .sp{flex:1}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
@media (max-width:720px){.row{grid-template-columns:1fr}.side{text-align:left;justify-items:start}#form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
#add,#save,#del,.foot{display:none!important}
#form :disabled{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);cursor:default}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="top"><div><h1>Job Request</h1><p class="sub" id="sub"></p></div><button class="btn hero" id="add">เพิ่มงาน</button></div>
  <div class="ports" id="ports" aria-label="ภาพรวมงานทั้งหมด หนึ่งช่องต่อหนึ่งงาน"></div>
</div></header>
<main class="wrap">
  <section class="kpis" id="kpis"></section>
  <section class="charts">
    <div class="card"><h3>Status</h3><div class="donutbox" id="donut"></div></div>
    <div class="card"><h3>Vendor</h3><div class="hb" id="brands"></div></div>
    <div class="card"><h3>Month</h3><div class="vb" id="months"></div></div>
  </section>
  <div class="bar">
    <input id="q" type="search" placeholder="ค้นหา Ticket" aria-label="ค้นหา Ticket">
    <select id="fb" aria-label="Filter by Vendor"></select>
    <select id="fe" aria-label="Filter by Engineer"></select>
    <select id="fm" aria-label="Filter by Month"></select>
    <button class="btn" id="clr" style="display:none">ล้างตัวกรอง</button>
  </div>
  <div class="list" id="list"></div>
  <div class="foot">
    <button class="btn" id="exp">ส่งออก CSV</button>
    <button class="btn" id="imp">นำเข้า CSV</button>
    <input type="file" id="file" accept=".csv,text/csv" multiple hidden>
  </div>
</main>
<div id="veil"></div>
<aside id="drawer" aria-label="รายละเอียดงาน" aria-hidden="true">
  <h2 id="dt">เพิ่มงาน</h2>
  <form id="form" autocomplete="off"></form>
  <div class="acts">
    <button class="btn pri" id="save" type="button">บันทึกงาน</button>
    <button class="btn" id="cancel" type="button">ปิด</button>
    <span class="sp"></span>
    <button class="btn del" id="del" type="button">ลบงาน</button>
  </div>
</aside>
<script>
(function(){
var KEY="allwork2026:tickets";
var F=[["no","Ticket No","t"],["level","Service Level","s",["Advance","Basic","Project"]],["brand","Brand","s",["Cisco","Huawei","Watchguard","TP-Link","Zyxel","Allied Telesis","HPE Aruba","Dell","Other"]],["status","Status","s",["Open","In Progress","Pending","Completed"]],["desc","Description","a"],["events","Latest Events","a"],["partner","Partner/Vender","t"],["enduser","EndUser","t"],["pm","Project Manager","t"],["engineer","Engineer","t"],["month","Month","t"]];
var STAT=["Open","In Progress","Pending","Completed"];
var SC={"Open":"var(--open)","In Progress":"var(--prog)","Pending":"var(--pend)","Completed":"var(--done)"};
var BC={"watchguard":"#c8261c","cisco":"#0b9bd7","huawei":"#3a9a3a","tp-link":"#17a2a2","zyxel":"#6a4fd6","allied telesis":"#b0376b","hpe aruba":"#e07a1f","dell":"#3b4a63","other":"#2b3f8f"};
var LC={"Advance":"#1769d6","Basic":"#e0a100","Project":"#2e9b3f"};
var MN="JanFebMarAprMayJunJulAugSepOctNovDec";
function MC(a,b){return MN.indexOf(a.slice(0,3))-MN.indexOf(b.slice(0,3))}
var T=[],fs="",editing=null,col=null,ready=false;
function load(){try{T=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){T=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(T))}catch(e){}}
function sortT(){T.sort(function(a,b){return(b.created||0)-(a.created||0)})}
function fail(){alert("บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ลองใหม่อีกครั้ง")}
function put(o){
  if(col)return col.doc(o.id).set(o).catch(fail);
  var i=T.findIndex(function(t){return t.id===o.id});if(i>-1)T[i]=o;else T.push(o);
  sortT();persist();render();return Promise.resolve();
}
function drop(id){
  if(col)return col.doc(id).delete().catch(fail);
  T=T.filter(function(t){return t.id!==id});persist();render();return Promise.resolve();
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(i){return document.getElementById(i)}
function bcol(b){return BC[String(b||"").toLowerCase()]||"#8793a6"}
function scol(s){return SC[s]||"var(--ot)"}
function hay(t){return F.map(function(f){return t[f[0]]||""}).join(" ").toLowerCase()}
function filtered(){
  var q=$("q").value.trim().toLowerCase(),b=$("fb").value,e=$("fe").value,m=$("fm").value;
  return T.filter(function(t){return(!fs||t.status===fs)&&(!b||t.brand===b)&&(!e||t.engineer===e)&&(!m||t.month===m)&&(!q||String(t.no||"").toLowerCase().indexOf(q)>-1)});
}
function opts(sel,key,label,cmp){
  var cur=sel.value,v=[];T.forEach(function(t){if(t[key]&&v.indexOf(t[key])<0)v.push(t[key])});v.sort(cmp);
  sel.innerHTML='<option value="">'+label+'</option>'+v.map(function(x){return'<option>'+esc(x)+'</option>'}).join("");
  sel.value=v.indexOf(cur)>-1?cur:"";
}
function tally(key){var m={};T.forEach(function(t){var v=t[key];if(v)m[v]=(m[v]||0)+1});return m}
function render(){
  if(!ready){$("sub").textContent="กำลังเชื่อมต่อ…";return}
  opts($("fb"),"brand","All Vendor");opts($("fe"),"engineer","All Engineer");opts($("fm"),"month","All Month",MC);
  var n=T.length,L=filtered(),ids={},cnt={},sum=0,fb=$("fb").value,fm=$("fm").value;
  L.forEach(function(t){ids[t.id]=1});
  STAT.forEach(function(s){cnt[s]=0});T.forEach(function(t){if(cnt[t.status]!=null){cnt[t.status]++;sum++}});
  var dp=n?Math.round(cnt.Completed*100/n):0;
  $("sub").textContent=(n?"แสดงอยู่ "+L.length+" จาก "+n+" งาน":"ยังไม่มีงานในระบบ")+" · ดูอย่างเดียว · ข้อมูล ณ 2 ต.ค. 2026";
  $("clr").style.display=(fs||fb||fm||$("fe").value||$("q").value)?"":"none";
  $("ports").innerHTML=n?T.map(function(t){return'<button class="port'+(ids[t.id]?"":" dim")+'" data-id="'+t.id+'" style="background:'+scol(t.status)+'" title="'+esc(t.no)+" · "+esc(t.status)+'" aria-label="'+esc(t.no)+'"></button>'}).join(""):'<span class="none">ทุกงานจะแสดงเป็นช่องหนึ่งช่อง สีตามสถานะ</span>';
  $("kpis").innerHTML='<button class="kpi" data-s="" aria-pressed="'+(!fs)+'" style="--c:var(--ink)"><span class="kn">'+n+'</span><span class="kl">งานทั้งหมด</span><span class="ks">เสร็จแล้ว '+dp+"%</span></button>"+STAT.map(function(s){return'<button class="kpi" data-s="'+s+'" aria-pressed="'+(fs===s)+'" style="--c:'+scol(s)+'"><span class="kn">'+cnt[s]+'</span><span class="kl">'+s+'</span><span class="ks">'+(n?Math.round(cnt[s]*100/n):0)+"% ของทั้งหมด</span></button>"}).join("");
  var g=[],acc=0;STAT.forEach(function(s){if(cnt[s]){g.push(scol(s)+" "+acc*3.6+"deg "+(acc+cnt[s]*100/n)*3.6+"deg");acc+=cnt[s]*100/n}});
  if(n&&sum<n)g.push("var(--ot) "+acc*3.6+"deg 360deg");
  $("donut").innerHTML='<div class="donut" style="background:'+(n?"conic-gradient("+g.join(",")+")":"var(--line)")+'"><div class="dh"><b>'+dp+'%</b><span>เสร็จแล้ว</span></div></div><div class="legend">'+STAT.map(function(s){return'<span><i style="background:'+scol(s)+'"></i>'+s+" "+cnt[s]+"</span>"}).join("")+"</div>";
  var bt=tally("brand"),bk=Object.keys(bt).sort(function(a,b){return bt[b]-bt[a]}),bm=bk.length?bt[bk[0]]:1;
  $("brands").innerHTML=bk.length?bk.map(function(k){return'<button class="hrow" data-b="'+esc(k)+'" aria-pressed="'+(fb===k)+'"><span>'+esc(k)+'</span><span class="track"><i style="width:'+Math.round(bt[k]*100/bm)+"%;background:"+bcol(k)+'"></i></span><b>'+bt[k]+"</b></button>"}).join(""):'<span class="mute">ยังไม่มีข้อมูลแบรนด์</span>';
  var mt=tally("month"),mk=Object.keys(mt).sort(MC),mm=mk.length?Math.max.apply(null,mk.map(function(k){return mt[k]})):1;
  $("months").innerHTML=mk.length?mk.map(function(k){return'<button class="vcol" data-m="'+esc(k)+'" aria-pressed="'+(fm===k)+'"><b>'+mt[k]+'</b><i style="height:'+Math.max(4,Math.round(mt[k]*100/mm*.9))+'%"></i><small>'+esc(k.slice(0,3))+"</small></button>"}).join(""):'<span class="mute">เดือนจะแสดงเมื่อนำเข้า CSV ที่มีชื่อเดือนในชื่อไฟล์</span>';
  if(!L.length){$("list").innerHTML='<div class="empty"><b>'+(n?"ไม่พบงานที่ตรงกับตัวกรอง":"เริ่มจากเพิ่มงานแรก")+'</b>'+(n?"ลองล้างตัวกรองหรือเปลี่ยนคำค้นหา":"กด “เพิ่มงาน” หรือ “นำเข้า CSV” เพื่อย้ายข้อมูลจาก Excel")+"</div>";return}
  $("list").innerHTML=L.map(function(t){var lc=LC[t.level]||"#8793a6";return'<button class="row" data-id="'+t.id+'" style="--bc:'+bcol(t.brand)+'"><span><span class="l1"><b>'+esc(t.no)+'</b><em class="lvl" style="background:'+lc+(t.level==="Basic"?";color:#3b2a00":"")+'">'+esc(t.level)+'</em><span class="br">'+esc(t.brand)+'</span></span><span class="ds">'+esc(t.desc)+"</span>"+(t.events?'<span class="ev">'+esc(t.events)+"</span>":"")+'</span><span class="side"><span class="pill" style="--c:'+scol(t.status)+'"><i></i>'+esc(t.status)+'</span><span class="who">'+esc(t.engineer)+(t.partner?" · "+esc(t.partner):"")+"</span></span></button>"}).join("");
}
function buildForm(){
  $("form").innerHTML=F.map(function(f){
    var k=f[0],full=(f[2]==="a"||k==="no")?"full":"",inner;
    if(f[2]==="s")inner='<select name="'+k+'">'+f[3].map(function(o){return"<option>"+o+"</option>"}).join("")+"</select>";
    else if(f[2]==="a")inner='<textarea name="'+k+'"></textarea>';
    else inner='<input name="'+k+'"'+(k==="brand"?' list="brands"':"")+">";
    return'<div class="'+full+'"><label>'+f[1]+inner+"</label></div>";
  }).join("");
}
function openDrawer(id){
  editing=id||null;var t=T.filter(function(x){return x.id===id})[0]||{};
  F.forEach(function(f){var el=$("form").elements[f[0]];if(f[2]==="s"&&t[f[0]]&&f[3].indexOf(t[f[0]])<0){var op=document.createElement("option");op.textContent=t[f[0]];el.appendChild(op)}el.value=t[f[0]]!=null?t[f[0]]:(f[2]==="s"?f[3][0]:"")});
  $("dt").textContent="รายละเอียดงาน";$("del").style.display=id?"":"none";
  document.body.classList.add("open");$("drawer").setAttribute("aria-hidden","false");$("form").elements.no.focus();
}
function closeDrawer(){document.body.classList.remove("open");$("drawer").setAttribute("aria-hidden","true")}
function save(){
  var o={};F.forEach(function(f){o[f[0]]=$("form").elements[f[0]].value.trim()});
  if(!o.no){$("form").elements.no.focus();$("form").elements.no.placeholder="กรอกเลข Ticket ก่อนบันทึก";return}
  if(editing){var old=T.filter(function(t){return t.id===editing})[0]||{};o.id=editing;o.created=old.created||Date.now()}
  else{o.id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);o.created=Date.now()}
  put(o);closeDrawer();
}
function csvEsc(v){v=String(v==null?"":v);return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(){return"\ufeff"+[F.map(function(f){return f[1]}).join(",")].concat(T.map(function(t){return F.map(function(f){return csvEsc(t[f[0]])}).join(",")})).join("\r\n")}
function parseCSV(s){
  var r=[],row=[],c="",q=false,i,ch;s=s.replace(/^\ufeff/,"");
  for(i=0;i<s.length;i++){ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[i+1]==="\n")i++;row.push(c);r.push(row);row=[];c=""}
    else c+=ch}
  if(c||row.length){row.push(c);r.push(row)}
  return r;
}
function monthOf(name){var m=/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[^a-z0-9]*(\d{4})/i.exec(name);return m?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+"-"+m[2]:""}
function parseFile(text,month){
  var rows=parseCSV(text),out=[],bad=false;if(rows.length<2)return{out:out,bad:true};
  var map=rows[0].map(function(h){h=h.trim().toLowerCase();var f=F.filter(function(x){return x[1].toLowerCase()===h})[0];return f?f[0]:null});
