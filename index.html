<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Request</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#10213f;--mute:#63728a;--line:#dde4ee;--accent:#2347e6;--navy:#0d1b3e;--open:#7b61d9;--prog:#2347e6;--pend:#e8731a;--done:#1f9d6b;--ot:#8793a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--card:#141e35;--ink:#e8edf7;--mute:#92a0b8;--line:#25324f;--accent:#7b93ff;--navy:#0a1226}}
:root[data-theme="dark"]{--bg:#0a1120;--card:#141e35;--ink:#e8edf7;--mute:#92a0b8;--line:#25324f;--accent:#7b93ff;--navy:#0a1226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans Thai",system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.hero{background:var(--navy);color:#fff;padding:30px 0 28px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,42px);font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.15}
.sub{color:#aebbd6;margin:4px 0 0}
.ports{display:flex;flex-wrap:wrap;gap:5px;min-height:18px}
.port{width:15px;height:15px;border-radius:4px;border:0;padding:0;cursor:pointer}
.port.dim{opacity:.2}
.ports .none{color:#aebbd6;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero :focus-visible{outline-color:#fff}
main.wrap{padding-top:22px;padding-bottom:80px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card,.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,33,63,.06)}
.kpi{border-top:4px solid var(--c);padding:14px 16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column}
.kpi[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:-2px}
.kn{font-size:34px;font-weight:700;line-height:1.1}.kl{font-weight:500}.ks{color:var(--mute);font-size:13px}
.charts{display:grid;grid-template-columns:1fr 1.3fr 1.4fr;gap:12px;margin-bottom:22px}
.card{padding:16px 18px}.card h3{margin:0 0 12px;font-size:16px;font-weight:600}
.donutbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;flex:none}
.dh{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-content:center;text-align:center;line-height:1.2}
.dh b{font-size:24px}.dh span{font-size:12px;color:var(--mute)}
.legend{font-size:13px;color:var(--mute);display:grid;gap:3px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px}
.hb{display:grid;gap:2px}
.hrow{display:grid;grid-template-columns:104px 1fr 28px;gap:10px;align-items:center;width:100%;background:none;border:0;padding:5px 6px;border-radius:8px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.hrow[aria-pressed="true"],.vcol[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.track i{display:block;height:100%;border-radius:5px}
.hrow b{text-align:right}
.vb{display:flex;align-items:flex-end;gap:6px;height:150px}
.vcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;background:none;border:0;border-radius:8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;padding:2px}
.vcol i{display:block;width:100%;max-width:32px;background:var(--accent);border-radius:6px 6px 0 0;min-height:4px}.vcol small{color:var(--mute);font-size:12px}
.mute{color:var(--mute);font-size:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input{flex:2 1 220px;width:auto}.bar select{flex:1 1 130px;width:auto}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.hero{background:#fff;border-color:#fff;color:#0d1b3e;font-weight:600}
.btn.del{color:#d33a30}
.list{display:grid;gap:9px}
.row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bc,var(--ot));border-radius:14px;padding:13px 16px;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(16,33,63,.05)}
.row:hover{border-color:var(--accent);border-left-color:var(--bc,var(--ot))}
.l1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.l1 b{font-size:14px}
.lvl{font-style:normal;font-size:12px;font-weight:600;color:#fff;padding:1px 9px;border-radius:999px}
.br{font-size:13px;font-weight:600;color:var(--bc)}
.ds{display:block;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev{display:block;color:var(--mute);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:62ch}
.side{text-align:right;display:grid;gap:5px;justify-items:end}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 11px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.who{font-size:13px;color:var(--mute);max-width:230px}
.empty{padding:44px 20px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.foot{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap}
#veil{position:fixed;inset:0;background:rgba(10,16,30,.5);display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body.open #drawer{transform:none}body.open #veil{display:block}
#drawer h2{margin:0;font-size:20px;padding:18px 20px 8px}
#form{overflow:auto;padding:8px 20px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#form label{font-size:13px;color:var(--mute);display:block}
#form .full{grid-column:1/-1}
#form textarea{min-height:76px;resize:vertical}
.acts{display:flex;gap:8px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.acts .sp{flex:1}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
@media (max-width:720px){.row{grid-template-columns:1fr}.side{text-align:left;justify-items:start}#form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}

.kpi,.hrow,.vcol{cursor:default}
.hrow[aria-pressed],.vcol[aria-pressed]{background:none}
#detail{margin:0;padding:8px 20px 16px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}
#detail dt{font-size:13px;color:var(--mute)}#detail dd{margin:0;white-space:pre-wrap;word-break:break-word}
#detail .full{grid-column:1/-1}
@media (max-width:720px){#detail{grid-template-columns:1fr}}

.list{gap:10px}
.grp{display:flex;align-items:center;gap:10px;margin:18px 2px 2px;font-size:15px;font-weight:600;letter-spacing:.01em}
.grp span{font-size:13px;font-weight:600;padding:1px 10px;border-radius:999px;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--mute)}
.none2{padding:18px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.row{position:relative;grid-template-columns:170px minmax(0,1fr) 230px;gap:8px 22px;align-items:start;padding:16px 20px 16px 26px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sc)}
.row:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(16,33,63,.10)}
.row .c1{display:grid;gap:7px;justify-items:start}
.tno{font-size:15px;font-weight:700;letter-spacing:.01em}
.vd{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--ink)}
.vd i{width:10px;height:10px;border-radius:3px;background:var(--bc)}
.row .c2{display:grid;gap:7px;min-width:0}
.row .ds{font-size:16px;font-weight:600;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .ev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;max-width:none;font-size:14px;line-height:1.5;color:var(--mute)}
.ev small{display:inline-block;margin-right:8px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.row .c3{display:grid;gap:6px;justify-items:end;text-align:right;min-width:0}
.row .pill{font-size:14px;padding:3px 13px}
.eng{font-size:14px;font-weight:500;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.par{font-size:13px;color:var(--mute);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row:has(.pill[style*="--pend"]){background:color-mix(in srgb,var(--pend) 7%,var(--card))}
@media (max-width:900px){.row{grid-template-columns:1fr}.row .c1{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}.row .c3{justify-items:start;text-align:left}}
.none2 b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.hint{margin:14px 2px 0;color:var(--mute);font-size:13.5px}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="top"><div><h1>Job Request</h1><p class="sub" id="sub"></p></div><button class="btn hero" id="imp">นำเข้า CSV</button></div>
  <div class="ports" id="ports" aria-label="ภาพรวมงานทั้งหมด หนึ่งช่องต่อหนึ่งงาน"></div>
</div></header>
<main class="wrap">
  <section class="kpis" id="kpis"></section>
  <section class="charts">
    <div class="card"><h3>Status</h3><div class="donutbox" id="donut"></div></div>
    <div class="card"><h3>Vendor</h3><div class="hb" id="brands"></div></div>
    <div class="card"><h3>Month</h3><div class="vb" id="months"></div></div>
  </section>
  <div class="list" id="list"></div>
  <input type="file" id="file" accept=".csv,text/csv" multiple hidden>
</main>
<div id="veil"></div>
<aside id="drawer" aria-label="รายละเอียดงาน" aria-hidden="true">
  <h2 id="dt"></h2>
  <dl id="detail"></dl>
  <div class="acts"><button class="btn" id="cancel" type="button">ปิด</button></div>
</aside>
<script>
(function(){
var KEY="jobrequest:monitor:v1";
var STAT=["Open","In Progress","Pending","Completed"];
var SC={"Open":"var(--open)","In Progress":"var(--prog)","Pending":"var(--pend)","Completed":"var(--done)"};
var BC={"watchguard":"#c8261c","cisco":"#0b9bd7","huawei":"#3a9a3a","tp-link":"#17a2a2","zyxel":"#6a4fd6","allied telesis":"#b0376b","hpe aruba":"#e07a1f","dell":"#3b4a63","other":"#2b3f8f"};
var LC={"Advance":"#1769d6","Basic":"#e0a100","Project":"#2e9b3f"};
var MN="JanFebMarAprMayJunJulAugSepOctNovDec";
var FIELDS=[["level","Service Level"],["brand","Vendor"],["status","Status"],["month","Month"],["engineer","Engineer"],["pm","Project Manager"],["partner","Partner/Vender"],["enduser","EndUser"],["desc","Description"],["events","Latest Events"]];
var H={"ticket no":"no","service level":"level","brand":"brand","vendor":"brand","description":"desc","status":"status","latest events":"events","partner/vender":"partner","partner/vendor":"partner","enduser":"enduser","project manager":"pm","engineer":"engineer","month":"month"};
var DATA=null,loadErr=false;
var T=[],updated=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function MC(a,b){return MN.indexOf(a.slice(0,3))-MN.indexOf(b.slice(0,3))}
function scol(s){return SC[s]||"var(--ot)"}
function bcol(b){return BC[String(b||"").toLowerCase()]||"#8793a6"}
function load(){
  var base=(DATA&&DATA.tickets)||[],bu=(DATA&&DATA.updated)||0,loc=null,by={};
  T=base.map(function(t){var c={};Object.keys(t).forEach(function(k){c[k]=t[k]});return c});updated=bu;
  T.forEach(function(t){by[t.no]=t});
  try{loc=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){loc=null}
  if(loc&&loc.updated>bu&&loc.tickets){
    loc.tickets.forEach(function(l){var ex=by[l.no];if(ex){Object.keys(l).forEach(function(k){if(k!=="id")ex[k]=l[k]})}else{T.push(l);by[l.no]=l}});
    updated=loc.updated;
  }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tickets:T,updated:updated}))}catch(e){alert("บันทึกข้อมูลในเบราว์เซอร์ไม่สำเร็จ (พื้นที่เต็มหรือถูกบล็อก)")}}
function sorted(){return T.slice().sort(function(a,b){return((a.status==="Completed")-(b.status==="Completed"))||((b.created||0)-(a.created||0))})}
function tally(key){var m={};T.forEach(function(t){var v=t[key];if(v)m[v]=(m[v]||0)+1});return m}
function rowHtml(t){var lc=LC[t.level]||"#8793a6";return'<button class="row" data-id="'+esc(t.id)+'" style="--sc:'+scol(t.status)+";--bc:"+bcol(t.brand)+'"><span class="c1"><b class="tno">'+esc(t.no)+'</b><span class="vd"><i></i>'+esc(t.brand)+'</span><em class="lvl" style="background:'+lc+(t.level==="Basic"?";color:#3b2a00":"")+'">'+esc(t.level)+'</em></span><span class="c2"><span class="ds">'+esc(t.desc)+"</span>"+(t.events?'<span class="ev"><small>ล่าสุด</small>'+esc(t.events)+"</span>":"")+'</span><span class="c3"><span class="pill" style="--c:'+scol(t.status)+'"><i></i>'+esc(t.status)+'</span><span class="eng">'+esc(t.engineer||"-")+"</span>"+(t.partner&&t.partner!=="-"?'<span class="par">'+esc(t.partner)+"</span>":"")+"</span></button>"}
function render(){
  var n=T.length,L=sorted(),cnt={},sum=0;
  STAT.forEach(function(s){cnt[s]=0});T.forEach(function(t){if(cnt[t.status]!=null){cnt[t.status]++;sum++}});
  var dp=n?Math.round(cnt.Completed*100/n):0;
  var when=updated?new Date(updated).toLocaleString("th-TH-u-ca-gregory",{dateStyle:"medium",timeStyle:"short"}):"";
  $("sub").textContent=loadErr?"โหลดไฟล์ data.js ไม่สำเร็จ ตรวจว่าอัปโหลด data.js ไว้โฟลเดอร์เดียวกับ index.html แล้ว":(n?n+" งาน · ข้อมูล ณ "+when:"ยังไม่มีข้อมูล");
  $("ports").innerHTML=n?L.map(function(t){return'<button class="port" data-id="'+esc(t.id)+'" style="background:'+scol(t.status)+'" title="'+esc(t.no)+" · "+esc(t.status)+'" aria-label="'+esc(t.no)+'"></button>'}).join(""):'<span class="none">ทุกงานจะแสดงเป็นช่องหนึ่งช่อง สีตามสถานะ</span>';
  $("kpis").innerHTML='<div class="kpi" style="--c:var(--ink)"><span class="kn">'+n+'</span><span class="kl">งานทั้งหมด</span><span class="ks">เสร็จแล้ว '+dp+"%</span></div>"+STAT.map(function(s){return'<div class="kpi" style="--c:'+scol(s)+'"><span class="kn">'+cnt[s]+'</span><span class="kl">'+s+'</span><span class="ks">'+(n?Math.round(cnt[s]*100/n):0)+"% ของทั้งหมด</span></div>"}).join("");
  var g=[],acc=0;STAT.forEach(function(s){if(cnt[s]){g.push(scol(s)+" "+acc*3.6+"deg "+(acc+cnt[s]*100/n)*3.6+"deg");acc+=cnt[s]*100/n}});
  if(n&&sum<n)g.push("var(--ot) "+acc*3.6+"deg 360deg");
  $("donut").innerHTML='<div class="donut" style="background:'+(n?"conic-gradient("+g.join(",")+")":"var(--line)")+'"><div class="dh"><b>'+dp+'%</b><span>เสร็จแล้ว</span></div></div><div class="legend">'+STAT.map(function(s){return'<span><i style="background:'+scol(s)+'"></i>'+s+" "+cnt[s]+"</span>"}).join("")+"</div>";
  var bt=tally("brand"),bk=Object.keys(bt).sort(function(a,b){return bt[b]-bt[a]}),bm=bk.length?bt[bk[0]]:1;
  $("brands").innerHTML=bk.length?bk.map(function(k){return'<div class="hrow"><span>'+esc(k)+'</span><span class="track"><i style="width:'+Math.round(bt[k]*100/bm)+"%;background:"+bcol(k)+'"></i></span><b>'+bt[k]+"</b></div>"}).join(""):'<span class="mute">ยังไม่มีข้อมูล</span>';
  var mt=tally("month"),mk=Object.keys(mt).sort(MC),mm=mk.length?Math.max.apply(null,mk.map(function(k){return mt[k]})):1;
  $("months").innerHTML=mk.length?mk.map(function(k){return'<div class="vcol"><b>'+mt[k]+'</b><i style="height:'+Math.max(4,Math.round(mt[k]*100/mm*.9))+'%"></i><small>'+esc(k.slice(0,3))+"</small></div>"}).join(""):'<span class="mute">เดือนจะแสดงเมื่อชื่อไฟล์ CSV มีชื่อเดือน เช่น Jan-2026</span>';
  if(!n){$("list").innerHTML='<div class="empty"><b>ยังไม่มีข้อมูลงาน</b>กด “นำเข้า CSV” แล้วเลือกไฟล์ CSV ของแต่ละเดือนได้พร้อมกันหลายไฟล์</div>';return}
  var act=L.filter(function(t){return t.status!=="Completed"}),dn=L.filter(function(t){return t.status==="Completed"});
  $("list").innerHTML='<h3 class="grp">ต้องติดตาม <span>'+act.length+"</span></h3>"+(act.length?act.map(rowHtml).join(""):'<div class="none2"><b>ไม่มีเคสที่ค้างอยู่</b>ทุกงานเสร็จแล้ว</div>')+(dn.length?'<p class="hint">งานที่เสร็จแล้ว '+dn.length+" งาน ไม่แสดงในรายการนี้ แต่นับรวมในการ์ดสรุปและกราฟ · กดช่องสีด้านบนเพื่อดูรายละเอียด</p>":"");
}
function openDetail(id){
  var t=T.filter(function(x){return x.id===id})[0];if(!t)return;
  $("dt").textContent=t.no;
  $("detail").innerHTML=FIELDS.map(function(f){return'<div'+((f[0]==="desc"||f[0]==="events")?' class="full"':"")+"><dt>"+f[1]+"</dt><dd>"+(esc(t[f[0]])||"-")+"</dd></div>"}).join("");
  document.body.classList.add("open");$("drawer").setAttribute("aria-hidden","false");$("cancel").focus();
}
function closeDetail(){document.body.classList.remove("open");$("drawer").setAttribute("aria-hidden","true")}
function parseCSV(s){
  var r=[],row=[],c="",q=false,i,ch;s=s.replace(/^\ufeff/,"");
  for(i=0;i<s.length;i++){ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&s[i+1]==="\n")i++;row.push(c);r.push(row);row=[];c=""}
    else c+=ch}
  if(c||row.length){row.push(c);r.push(row)}
  return r;
}
function monthOf(name){var m=/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[^a-z0-9]*(\d{4})/i.exec(name);return m?m[1][0].toUpperCase()+m[1].slice(1).toLowerCase()+"-"+m[2]:""}
function readFile(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){res({name:f.name,text:String(r.result)})};r.onerror=function(){res({name:f.name,text:""})};r.readAsText(f)})}
function importFiles(files){
  Promise.all(files.map(readFile)).then(function(list){
    var byNo={},added=0,changed=0,bad=[],base=Date.now();
    T.forEach(function(t){byNo[t.no]=t});
    list.forEach(function(x,fi){
      var rows=parseCSV(x.text);if(rows.length<2){bad.push(x.name);return}
      var map=rows[0].map(function(h){return H[h.trim().toLowerCase()]||null});
      if(map.indexOf("no")<0){bad.push(x.name);return}
      var mo=monthOf(x.name);
      rows.slice(1).forEach(function(r,i){
        var o={};map.forEach(function(k,j){if(k)o[k]=(r[j]||"").trim()});
        if(!o.no)return;if(!o.month&&mo)o.month=mo;
        var ex=byNo[o.no];
        if(ex){Object.keys(o).forEach(function(k){ex[k]=o[k]});changed++}
        else{o.id="t"+base.toString(36)+fi+"x"+i+Math.random().toString(36).slice(2,5);o.created=base+fi*100000-i;byNo[o.no]=o;T.push(o);added++}
      });
    });
    if(added||changed){updated=Date.now();save();render()}
    alert("นำเข้างานใหม่ "+added+" งาน อัปเดตงานเดิม "+changed+" งาน"+(bad.length?"\nอ่านไม่ได้ (ไม่พบคอลัมน์ Ticket No): "+bad.join(", "):""));
  });
}
$("list").addEventListener("click",function(e){var b=e.target.closest(".row");if(b)openDetail(b.dataset.id)});
$("ports").addEventListener("click",function(e){var b=e.target.closest(".port");if(b)openDetail(b.dataset.id)});
$("cancel").addEventListener("click",closeDetail);$("veil").addEventListener("click",closeDetail);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDetail()});
$("imp").addEventListener("click",function(){$("file").click()});
$("file").addEventListener("change",function(){var fl=Array.prototype.slice.call(this.files);this.value="";if(fl.length)importFiles(fl)});
$("sub").textContent="กำลังโหลดข้อมูล…";
function boot(d,err){DATA=d||null;loadErr=!!err;load();render()}
var sc=document.createElement("script");sc.src="data.js?_="+Date.now();
sc.onload=function(){window.JOB_DATA&&window.JOB_DATA.tickets?boot(window.JOB_DATA,false):boot(null,true)};
sc.onerror=function(){boot(null,true)};
document.head.appendChild(sc);
})();
</script>
