<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e5ebf3;--panel:#f8fafd;--inset:#eaeff6;--line:#d0d9e6;--ink:#0d1930;--mute:#52627d;
  --open:#7357e8;--prog:#2563eb;--pend:#f59e0b;--done:#13a074;--attn:#b45309;--accent:#2347e6;--tint:9%;
  --f-display:"Chakra Petch","IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#080f1c;--panel:#0f192c;--inset:#0b1424;--line:#1f2d47;--ink:#e8eef9;--mute:#8d9db9;
  --open:#a08eff;--prog:#5b9dff;--pend:#ffb020;--done:#2fc48d;--attn:#ffb020;--accent:#7b93ff;--tint:3.5%;color-scheme:dark}}
*{box-sizing:border-box}
html{font-size:clamp(15px,.5vw + 8.2px,19px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:105rem;margin:0 auto;padding:max(1.4rem,env(safe-area-inset-top)) 1.6rem calc(4rem + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.3rem;flex-wrap:wrap}
h1{margin:0;font:700 clamp(1.7rem,2.4vw,2.3rem)/1.1 var(--f-display);letter-spacing:.005em}
.stamp{margin:.25rem 0 0;color:var(--mute);font-size:.95rem}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:.5rem 1.15rem;cursor:pointer;color:var(--mute);font-weight:500}
.ghost:hover{color:var(--ink);border-color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:1.15rem}
.sec{margin:0 0 1rem;font:600 1.02rem/1.3 var(--f-body);color:var(--mute);display:flex;align-items:center;gap:.6rem}
.sec .n{font:600 .9rem var(--f-display);color:var(--ink);background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:0 .65rem}

/* hero */
.hero{display:grid;grid-template-columns:minmax(15rem,.62fr) minmax(0,1.5fr);margin-bottom:1.5rem;overflow:hidden}
.hero .attn{background:color-mix(in srgb,var(--done) var(--tint),var(--panel))}
.attn{padding:1.7rem 2rem 1.6rem;border-right:1px solid var(--line);display:flex;flex-direction:column}
.big{font:700 clamp(6rem,11.5vw,12rem)/.86 var(--f-display);color:var(--done);letter-spacing:-.02em;margin:.3rem 0 .9rem;font-variant-numeric:tabular-nums}
.big.ok{color:var(--done)}
.lead{margin:auto 0 0;color:var(--mute);font-size:1.05rem}
.stat{padding:1.7rem 2rem 1.6rem}
.statbody{display:flex;align-items:center;gap:2.2rem;flex-wrap:wrap}
.ringwrap{position:relative;width:12.5rem;flex:none}
.ringwrap svg{display:block;width:100%;height:auto;transform:rotate(-90deg)}
.ringc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringc b{font:700 2.1rem/1 var(--f-display)}.ringc span{color:var(--mute);font-size:.95rem}
.srows{list-style:none;margin:0;padding:0;flex:1 1 20rem;display:grid}
.srow{display:grid;grid-template-columns:.8rem 6.6rem minmax(3rem,1fr) 3.8rem 2.8rem;gap:.9rem;align-items:center;padding:1rem 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .dot{width:.8rem;height:.8rem;border-radius:50%;background:var(--c)}
.sbar{height:.5rem;border-radius:999px;background:var(--inset);overflow:hidden}.sbar i{display:block;height:100%;border-radius:999px;background:var(--c)}
.srow .sn{font-weight:500;white-space:nowrap}
.srow .sc{font:700 2.1rem/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.srow .sp{color:var(--mute);font-size:.9rem;text-align:right}
.srow.zero .sc,.srow.zero .sn{color:var(--mute);font-weight:400}.srow.zero .dot{opacity:.45}

/* month + vendor */
.duo{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.5rem}
.duo .panel{padding:1.5rem 1.8rem 1.4rem;display:flex;flex-direction:column}
.meters{display:flex;align-items:flex-end;gap:.55rem;padding-top:.3rem}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.4rem}
.mnum{font:600 1rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:2.8rem}
.seg{display:block;height:.62rem;width:100%;border-radius:2px;background:var(--c)}
.seg.dn{background:color-mix(in srgb,var(--c) 58%,var(--inset))}
.seg.on{box-shadow:0 0 .55rem color-mix(in srgb,var(--c) 75%,transparent)}
.mlab{color:var(--mute);font-size:.9rem}
.key{margin:1rem 0 0;color:var(--mute);font-size:.9rem}
.vend{display:grid;gap:.1rem;flex:1;align-content:space-evenly}
.vrow{display:grid;grid-template-columns:8.2rem minmax(0,1fr) 2.4rem;gap:.9rem;align-items:center;padding:.42rem 0}
.vname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtrack{height:.72rem;background:var(--inset);border-radius:999px;overflow:hidden}
.vtrack i{display:block;height:100%;border-radius:999px;background:var(--vc)}
.vnum{font:700 1.2rem/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}

@media (max-width:1000px){
  .hero,.duo{grid-template-columns:1fr}
  .attn{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:520px){.srow{grid-template-columns:.8rem 6.2rem minmax(1.5rem,1fr) 3rem 2.3rem;gap:.55rem}.shell{padding-inline:1rem}.attn,.stat{padding:1.3rem 1.2rem}.statbody{gap:1.2rem}.duo .panel{padding:1.2rem 1.1rem}.vrow{grid-template-columns:6.6rem minmax(0,1fr) 2.2rem}}
@media (prefers-reduced-motion:reduce){.led{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div><h1>Job Request</h1><p class="stamp" id="sub">กำลังโหลดข้อมูล…</p></div>
  </header>
  <main>
    <section class="panel hero" id="hero" aria-label="สรุปสถานะ">
      <div class="attn" id="attn"></div>
      <div class="stat" id="stat"></div>
    </section>
    <section class="duo">
      <div class="panel"><h2 class="sec">Month</h2><div class="meters" id="months"></div><p class="key" id="mkey"></p></div>
      <div class="panel"><h2 class="sec">Vendor</h2><div class="vend" id="brands"></div></div>
    </section>
  </main>
</div>
<script>
(function(){
var STAT=["Pending","Completed"];
var SC={"Pending":"var(--pend)","Completed":"var(--done)"};
var VC={"watchguard":"#e5483d","cisco":"#1ba1e2","huawei":"#4cae4f","tp-link":"#14b8a6","zyxel":"#8b7cf6","allied telesis":"#d9467f","hpe aruba":"#f08a24","dell":"#6f8fb8","other":"#8693ad"};
var LC={"Advance":"#2f6fe4","Basic":"#e0a100","Project":"#2e9b4f"};
var MN="JanFebMarAprMayJunJulAugSepOctNovDec";
var DATA=null,loadErr=false,T=[],updated=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function MC(a,b){return MN.indexOf(a.slice(0,3))-MN.indexOf(b.slice(0,3))}
function scol(s){return SC[s]||"var(--mute)"}
function vcol(b){return VC[String(b||"").toLowerCase()]||"#8693ad"}
function so(s){var i=STAT.indexOf(s);return i<0?9:i}
function load(){
  T=((DATA&&DATA.tickets)||[]).slice();updated=(DATA&&DATA.updated)||0;
}
function tally(key){var m={};T.forEach(function(t){var v=t[key];if(v)m[v]=(m[v]||0)+1});return m}
function ring(cnt,n){
  var R=78,C=2*Math.PI*R,off=0,segs="";
  if(n){STAT.forEach(function(s){var c=cnt[s];if(!c)return;var len=c/n*C,gap=c===n?0:Math.min(3.5,len*.4),vis=Math.max(len-gap,.1);
    segs+='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke-width="17" style="stroke:'+scol(s)+'" stroke-dasharray="'+vis.toFixed(2)+" "+(C-vis).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len})}
  return'<svg viewBox="0 0 200 200" role="img" aria-label="สัดส่วนสถานะงาน"><circle cx="100" cy="100" r="'+R+'" fill="none" stroke-width="17" style="stroke:var(--inset)"/>'+segs+"</svg>";
}
function render(){
  var n=T.length,cnt={},known=0;
  STAT.forEach(function(s){cnt[s]=0});T.forEach(function(t){if(cnt[t.status]!=null){cnt[t.status]++;known++}});
  var dp=n?Math.round(cnt.Completed*100/n):0,other=n-known,pn=cnt.Pending;
  var yrs={};T.forEach(function(t){var m=/(\d{4})$/.exec(t.month||"");if(m)yrs[m[1]]=1});
  var yr=Object.keys(yrs).sort().join("–");
  var when=updated?new Date(updated).toLocaleString("th-TH-u-ca-gregory",{dateStyle:"medium",timeStyle:"short"}):"";
  $("sub").textContent=loadErr?"โหลดไฟล์ data.js ไม่สำเร็จ ตรวจว่าอัปโหลด data.js ไว้โฟลเดอร์เดียวกับ index.html แล้ว":(n?"สรุปงานปี "+(yr||"-")+" · ข้อมูล ณ "+when:"ยังไม่มีข้อมูล");
  $("attn").innerHTML='<h2 class="sec">ทำเสร็จแล้ว'+(yr?" · ปี "+esc(yr):"")+'</h2><div class="big">'+cnt.Completed+'</div><p class="lead">'+(!n?"ยังไม่มีข้อมูลงาน":"จากทั้งหมด "+n+" งาน"+(pn?" · ยังค้าง "+pn+" งาน":" · ไม่มีงานค้าง"))+"</p>";
  $("stat").innerHTML='<h2 class="sec">Status</h2><div class="statbody"><div class="ringwrap">'+ring(cnt,n)+'<div class="ringc"><b>'+dp+'%</b><span>เสร็จแล้ว</span></div></div><ul class="srows">'
   +STAT.map(function(s){return'<li class="srow'+(cnt[s]?"":" zero")+'" style="--c:'+scol(s)+'"><i class="dot"></i><span class="sn">'+s+'</span><span class="sbar"><i style="width:'+(cnt[s]?Math.max(2,Math.round(cnt[s]*100/n)):0)+'%"></i></span><b class="sc">'+cnt[s]+'</b><span class="sp">'+(n?Math.round(cnt[s]*100/n):0)+"%</span></li>"}).join("")
   +(other>0?'<li class="srow" style="--c:var(--mute)"><i class="dot"></i><span class="sn">อื่น ๆ</span><span class="sbar"><i style="width:'+Math.max(2,Math.round(other*100/n))+'%"></i></span><b class="sc">'+other+'</b><span class="sp">'+Math.round(other*100/n)+"%</span></li>":"")+"</ul></div>";
  var by={};T.forEach(function(t){if(t.month)(by[t.month]=by[t.month]||[]).push(t)});
  var mk=Object.keys(by).sort(MC);
  $("months").innerHTML=mk.length?mk.map(function(k){
    var arr=by[k].slice().sort(function(a,b){return(b.status==="Completed")-(a.status==="Completed")||so(a.status)-so(b.status)});
    return'<div class="mcol"><span class="mnum">'+arr.length+'</span><div class="stack">'+arr.map(function(t){var d=t.status==="Completed";return'<i class="seg '+(d?"dn":"on")+'" style="--c:'+scol(t.status)+'"></i>'}).join("")+'</div><span class="mlab">'+esc(k.slice(0,3))+"</span></div>"}).join(""):'<span class="mute">ยังไม่มีข้อมูลรายเดือน</span>';
  $("mkey").textContent=mk.length?"1 ช่อง = 1 งาน · สีสว่างคือเคสที่ยังไม่เสร็จ · สีจางคือเสร็จแล้ว":"";
  var bt=tally("brand"),bk=Object.keys(bt).sort(function(a,b){return bt[b]-bt[a]}),bm=bk.length?bt[bk[0]]:1;
  $("brands").innerHTML=bk.length?bk.map(function(k){return'<div class="vrow" style="--vc:'+vcol(k)+'"><span class="vname">'+esc(k)+'</span><span class="vtrack"><i style="width:'+Math.max(2,Math.round(bt[k]*100/bm))+'%"></i></span><b class="vnum">'+bt[k]+"</b></div>"}).join(""):'<span class="mute">ยังไม่มีข้อมูล</span>';
}
function boot(d,err){DATA=d||null;loadErr=!!err;load();render()}
var sc=document.createElement("script");sc.src="data.js?_="+Date.now();
sc.onload=function(){window.JOB_DATA&&window.JOB_DATA.tickets?boot(window.JOB_DATA,false):boot(null,true)};
sc.onerror=function(){boot(null,true)};
document.head.appendChild(sc);
})();
</script>
</body>
</html>
